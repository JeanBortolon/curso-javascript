<!DOCTYPE html>
<!-- Informa ao navegador que este é um documento HTML5 -->
<html lang="en">
<head>
    <!-- Codificação de caracteres: permite acentos e caracteres especiais -->
    <meta charset="UTF-8">
    <!-- Faz a página se ajustar à largura da tela (celulares) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Texto que aparece na aba do navegador -->
    <title>Document</title>
</head>
<body>
    <h1>Hello World - JavaScript</h1>

    <!-- Liga o arquivo script.js à página. É onde ficam todas as anotações
         do curso. Abra o Console (F12) para ver os resultados.
         Obs: o alert() do script trava a página até clicar em "OK". -->
    <script src="script.js"></script>

    <!-- Liga o arquivo de estilos (deixa o h1 vermelho) -->
    <link rel="stylesheet" href="style.css">
</body>
</html>
